name: Helpmey Cloudflare build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cloudflare-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/cloudflare-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and OpenNext Worker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build Cloudflare Worker with OpenNext
        run: npm run build
